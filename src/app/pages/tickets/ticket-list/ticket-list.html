<div class="ticket-page">

  <div class="page-header">
    <div>
      <h1>All Tickets</h1>
      <p>Search, filter and manage tickets</p>
    </div>

    <a
      *ngIf="authService.isAdmin() || authService.isEmployee()"
      routerLink="/tickets/create"
      class="create-btn">
      + Create Ticket
    </a>
  </div>

  <div class="filters">
    <input [(ngModel)]="searchText" placeholder="Search tickets..." />

    <select [(ngModel)]="statusFilter">
      <option value="All">All Status</option>
      <option value="Open">Open</option>
      <option value="In-Progress">In Progress</option>
      <option value="Closed">Closed</option>
    </select>

    <select [(ngModel)]="priorityFilter">
      <option value="All">All Priority</option>
      <option value="Low">Low</option>
      <option value="Medium">Medium</option>
      <option value="High">High</option>
    </select>
  </div>

  <div class="table-card">

    <div *ngIf="paginatedTickets.length === 0" class="empty">
      No tickets found.
    </div>

    <table *ngIf="paginatedTickets.length > 0">
      <thead>
        <tr>
          <th>Title</th>
          <th>Status</th>
          <th>Priority</th>
          <th>Created By</th>
          <th>Assigned To</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let t of paginatedTickets">
          <td>
            <strong>{{ t.title }}</strong><br />
            <small>{{ t.desc }}</small>
          </td>

          <td>
            <span class="badge status" [ngClass]="t.status">
              {{ t.status.replace('-', ' ') }}
            </span>
          </td>

          <td>
            <span class="badge priority" [ngClass]="t.priority">
              {{ t.priority }}
            </span>
          </td>

          <td>{{ t.createdBy }}</td>
          <td>{{ t.assignedTo }}</td>

          <td class="actions">
            <a [routerLink]="['/tickets', t.id]">View</a>

            <button
              *ngIf="authService.isAdmin() || authService.isSupport()"
              (click)="close(t.id)">
              Close
            </button>

            <button
              *ngIf="authService.isAdmin()"
              class="delete"
              (click)="delete(t.id)">
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="pagination" *ngIf="filteredTickets.length > 0">
      <button (click)="prevPage()" [disabled]="page === 1">Prev</button>
      <span>Page {{ page }} of {{ totalPages }}</span>
      <button (click)="nextPage()" [disabled]="page === totalPages">Next</button>
    </div>

  </div>

</div>
