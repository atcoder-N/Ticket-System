<div class="login-page">

  <div class="login-card">
    <h1>Ticket System</h1>
    <p class="subtitle">Login to continue</p>

    <div class="error" *ngIf="error">
      {{ error }}
    </div>

    <label>Username</label>
    <input [(ngModel)]="username" placeholder="Enter username" />

    <label>Password</label>
    <input [(ngModel)]="password" type="password" placeholder="Enter password" />

    <button class="login-btn" (click)="login()">Login</button>

    <div class="demo-box">
      <h3>Demo Credentials</h3>

      <button type="button" (click)="fillDemo('admin', 'admin123')">
        Admin: admin / admin123
      </button>

      <button type="button" (click)="fillDemo('support', 'support123')">
        IT Support: support / support123
      </button>

      <button type="button" (click)="fillDemo('employee', 'employee123')">
        Employee: employee / employee123
      </button>
    </div>
  </div>

</div>
